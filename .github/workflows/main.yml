name: SMC Hybrid Scalping Hunter

on:
  schedule:
    # Mengecek tiap 30 menit; jika sesi 5 jam 40 menit masih jalan, antrean tidak akan menimpa sesi aktif
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      poll_seconds:
        description: "Durasi aktif bot dalam detik (default 20400 = 5 jam 40 menit)"
        required: false
        default: "20400"

concurrency:
  group: smc-hybrid-scalping-runner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-smc-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run SMC Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RUNNER_POLL_SECONDS: ${{ github.event.inputs.poll_seconds || '20400' }}
        run: |
          python main.py --poll-seconds "$RUNNER_POLL_SECONDS"

      - name: Save user preferences
        if: always()
        run: |
          if [ -f data/user_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/user_state.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: update bot state [skip ci]"
              git push
            fi
          fi
