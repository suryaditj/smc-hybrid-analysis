name: SMC Hybrid Scalping Hunter

on:
  schedule:
    # Scheduler minimum GitHub Actions: setiap 15 menit (menghindari antrean cron agresif)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      poll_seconds:
        description: "Durasi window mendengarkan Telegram (detik)"
        required: false
        default: "210"

# Mencegah workflow saling bertumpuk (overlap)
concurrency:
  group: smc-hybrid-scalping-runner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-smc-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (SMC Engine, Risk & Pip Config)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Execute SMC Telegram Bot Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RUNNER_POLL_SECONDS: ${{ github.event.inputs.poll_seconds || '210' }}
        run: |
          python main.py --mode github-actions --poll-seconds "$RUNNER_POLL_SECONDS"

      - name: Persist user preferences & update offset
        if: always()
        run: |
          if [ -f data/user_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/user_state.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: update bot state [skip ci]"
              git push
            fi
          fi
